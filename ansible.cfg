[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Vérification des clés d'hôte activée : au premier contact, faire un
# `ssh -p <port> user@hote` manuel pour enregistrer l'empreinte.
host_key_checking = True
interpreter_python = auto_silent
retry_files_enabled = False
force_color = True
callback_result_format = yaml

[privilege_escalation]
become_ask_pass = True

[ssh_connection]
pipelining = True
