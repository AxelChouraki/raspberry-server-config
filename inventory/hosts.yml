---
# Inventaire. Les groupes pilotent les rôles appliqués par site.yml :
#   servers    -> socle commun (paquets, users, ssh, pare-feu, logwatch, ...)
#   monitoring -> node_exporter + prometheus + alertmanager (surveillance mutuelle)
#   grafana    -> grafana
all:
  vars:
    ansible_user: sramy
    ansible_port: 2002 # premier run sur une machine vierge : -e ansible_port=22
  children:
    servers:
      hosts:
        rpi1:
          ansible_host: 192.168.1.44 # Pi 5 8 Go, carte SD
        rpi2:
          ansible_host: 192.168.1.46 # Pi 5 8 Go, NVMe 1 To
    monitoring:
      children:
        servers:
    grafana:
      children:
        servers:
