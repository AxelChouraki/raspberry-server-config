---
- name: Installer les paquets de base
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Activer les mises à jour de sécurité automatiques
  when: common_unattended_upgrades
  block:
    - name: Installer unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present

    - name: Planifier les mises à jour automatiques
      ansible.builtin.template:
        src: 20auto-upgrades.j2
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: "0644"
