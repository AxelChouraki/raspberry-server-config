---
- name: Créer l'utilisateur système alertmanager
  ansible.builtin.user:
    name: "{{ alertmanager_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Installer le binaire alertmanager
  ansible.builtin.include_role:
    name: prometheus_binary
  vars:
    prometheus_binary_repo: alertmanager
    prometheus_binary_version: "{{ alertmanager_version }}"
    prometheus_binary_files: [alertmanager, amtool]
    prometheus_binary_notify: Restart alertmanager

- name: Créer le dossier de configuration
  ansible.builtin.file:
    path: "{{ alertmanager_config_dir }}"
    state: directory
    owner: root
    group: "{{ alertmanager_user }}"
    mode: "0750"

- name: Créer le dossier de données
  ansible.builtin.file:
    path: "{{ alertmanager_data_dir }}"
    state: directory
    owner: "{{ alertmanager_user }}"
    group: "{{ alertmanager_user }}"
    mode: "0750"

- name: Déployer alertmanager.yml
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ alertmanager_config_dir }}/alertmanager.yml"
    owner: root
    group: "{{ alertmanager_user }}"
    mode: "0640" # contient le webhook Discord
    validate: /usr/local/bin/amtool check-config %s
  notify: Restart alertmanager

- name: Supprimer l'ancienne unité systemd (ancien playbook)
  ansible.builtin.file:
    path: /usr/lib/systemd/system/alertmanager.service
    state: absent

- name: Déployer le service alertmanager
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart alertmanager

- name: Activer et démarrer alertmanager
  ansible.builtin.systemd:
    name: alertmanager
    enabled: true
    state: started
    daemon_reload: true
