---
alertmanager_version: latest
alertmanager_user: prometheus
alertmanager_config_dir: /etc/alertmanager
alertmanager_data_dir: /var/lib/alertmanager
alertmanager_listen_address: "0.0.0.0:9093"
# URL du webhook Discord (secret : à définir dans le vault).
discord_webhook_url: ""

alertmanager_group_wait: 30s
alertmanager_group_interval: 5m
alertmanager_repeat_interval: 3h

# Les Alertmanager des hôtes de ce groupe forment un cluster : une alerte vue
# par plusieurs Prometheus n'est envoyée qu'une seule fois sur Discord.
alertmanager_cluster_group: monitoring
alertmanager_cluster_port: 9094
