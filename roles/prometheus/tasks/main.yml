---
- name: Créer l'utilisateur système prometheus
  ansible.builtin.user:
    name: "{{ prometheus_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Installer les binaires prometheus
  ansible.builtin.include_role:
    name: prometheus_binary
  vars:
    prometheus_binary_repo: prometheus
    prometheus_binary_version: "{{ prometheus_version }}"
    prometheus_binary_files: [prometheus, promtool]
    prometheus_binary_notify: Restart prometheus

- name: Créer les dossiers de configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ prometheus_user }}"
    mode: "0750"
  loop:
    - "{{ prometheus_config_dir }}"
    - "{{ prometheus_config_dir }}/rules"

- name: Créer le dossier de données
  ansible.builtin.file:
    path: "{{ prometheus_data_dir }}"
    state: directory
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_user }}"
    mode: "0750"

# Règles issues de https://samber.github.io/awesome-prometheus-alerts/
- name: Déployer les règles d'alerte
  ansible.builtin.copy:
    src: rules/
    dest: "{{ prometheus_config_dir }}/rules/"
    owner: root
    group: "{{ prometheus_user }}"
    mode: "0640"
  notify: Reload prometheus

- name: Vérifier les règles d'alerte
  ansible.builtin.shell: /usr/local/bin/promtool check rules {{ prometheus_config_dir }}/rules/*.yml
  changed_when: false
  check_mode: false

- name: Déployer prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: "{{ prometheus_user }}"
    mode: "0640"
    validate: /usr/local/bin/promtool check config %s
  notify: Reload prometheus

- name: Supprimer l'ancienne unité systemd (ancien playbook)
  ansible.builtin.file:
    path: /usr/lib/systemd/system/prometheus.service
    state: absent

- name: Déployer le service prometheus
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart prometheus

- name: Activer et démarrer prometheus
  ansible.builtin.systemd:
    name: prometheus
    enabled: true
    state: started
    daemon_reload: true
