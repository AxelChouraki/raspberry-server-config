---
- name: Installer la clé publique de l'utilisateur par défaut
  ansible.posix.authorized_key:
    user: "{{ default_user }}"
    key: "{{ lookup('ansible.builtin.file', ssh_default_user_key_file) }}"
    state: present

# Port est cumulatif dans sshd_config (plusieurs lignes = plusieurs ports) :
# on le gère dans le fichier principal, le reste part dans un drop-in.
- name: Définir le port SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Port '
    line: "Port {{ ssh_port }}"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Inclure les drop-in sshd_config.d
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?\s*Include\s+/etc/ssh/sshd_config\.d/\*\.conf'
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

# sshd retient la PREMIÈRE valeur rencontrée : le drop-in, inclus en tête de
# sshd_config, prend le pas sur ce qui reste dans le fichier principal.
- name: Déployer le durcissement SSH
  ansible.builtin.template:
    src: 10-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Configurer Fail2ban
  when: ssh_fail2ban_enabled
  block:
    - name: Installer Fail2ban
      ansible.builtin.apt:
        name:
          - fail2ban
          - python3-systemd # lecture du journal systemd (plus de /var/log/auth.log sur Debian 12+)
        state: present

    - name: Déployer la jail sshd
      ansible.builtin.template:
        src: jail.local.j2
        dest: /etc/fail2ban/jail.local
        owner: root
        group: root
        mode: "0644"
      notify: Restart fail2ban

    - name: Activer Fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started
