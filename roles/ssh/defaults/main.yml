---
default_user: pi
ssh_port: 22
ssh_client_alive_interval: 600
ssh_client_alive_count_max: 3
ssh_max_auth_tries: 3
ssh_password_authentication: false
ssh_permit_root_login: false
# Clé publique installée pour default_user (fichier dans roles/ssh/files/).
ssh_default_user_key_file: default_user.pub

ssh_host_keys:
  - /etc/ssh/ssh_host_ed25519_key
  - /etc/ssh/ssh_host_rsa_key
# Algorithmes recommandés par ssh-audit. Uniquement des échanges de clés à
# courbes elliptiques : /etc/ssh/moduli n'est plus utilisé, inutile de le régénérer.
ssh_kex_algorithms:
  - sntrup761x25519-sha512@openssh.com
  - curve25519-sha256
  - curve25519-sha256@libssh.org
ssh_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr
ssh_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - umac-128-etm@openssh.com

# Fail2ban
ssh_fail2ban_enabled: true
ssh_fail2ban_max_retry: 5
ssh_fail2ban_ban_time: 1h
ssh_fail2ban_find_time: 10m
