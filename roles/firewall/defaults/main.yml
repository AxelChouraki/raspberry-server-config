---
ssh_port: 22
# Sources autorisées en SSH. Liste vide = partout.
firewall_ssh_sources: []
# Réseaux de confiance (LAN d'admin, VPN) : accès aux ports "trusted".
firewall_trusted_sources: []
firewall_trusted_tcp_ports:
  - 3000 # Grafana
  - 9090 # Prometheus
  - 9093 # Alertmanager
# Ports ouverts au monde entier.
firewall_public_tcp_ports: []
firewall_public_udp_ports: []
# Ports ouverts aux seules IP Cloudflare (et aux réseaux de confiance).
firewall_cloudflare_tcp_ports: []

# Surveillance mutuelle : les autres hôtes de ce groupe peuvent joindre
# les ports de monitoring de celui-ci.
firewall_monitoring_group: monitoring
firewall_monitoring_tcp_ports:
  - 9090 # Prometheus
  - 9093 # Alertmanager
  - 9094 # Alertmanager (cluster)
  - 9100 # node_exporter
firewall_monitoring_udp_ports:
  - 9094 # Alertmanager (cluster, gossip)

# https://www.cloudflare.com/ips/ : à revérifier de temps en temps.
firewall_cloudflare_ipv4:
